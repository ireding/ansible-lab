---
- name: Deploy Website
  hosts: linux
  become: yes

  tasks:
    - name: Ensure nginx is installed
      apt: 
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy index.html
      copy:
        src: site/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
